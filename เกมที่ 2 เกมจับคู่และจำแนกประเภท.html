<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interface Sorting Lab</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef3f8;color:#17212b}
  .app{max-width:1100px;margin:auto;padding:28px 18px 40px}
  header{background:#172b4d;color:white;border-radius:22px;padding:24px 28px;box-shadow:0 10px 30px #172b4d22}
  h1{margin:0 0 6px;font-size:32px}.sub{opacity:.85}
  .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:18px 0}
  .progress{height:10px;background:#d7e0ea;border-radius:99px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;width:50%;background:#3b82f6;transition:.3s}
  .round{font-weight:700;white-space:nowrap}
  .instruction{text-align:center;font-size:20px;font-weight:700;margin:20px 0}
  .items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
  .item{background:white;border:2px solid #d8e1ea;border-radius:16px;padding:17px;text-align:center;cursor:grab;box-shadow:0 5px 15px #172b4d10;user-select:none}
  .item:active{cursor:grabbing}.item.locked{opacity:.45;cursor:default}
  .icon{font-size:32px;display:block;margin-bottom:5px}
  .zones{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .zone{min-height:230px;background:white;border:3px dashed #9fb1c3;border-radius:20px;padding:18px;transition:.2s}
  .zone.over{border-color:#3b82f6;background:#eff6ff;transform:scale(1.01)}
  .zone h2{margin:0 0 5px}.zone p{margin:0 0 14px;color:#637386}
  .drop-list{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:9px 12px;border-radius:12px;background:#e8f0f8;font-weight:650}
  .feedback{min-height:52px;margin-top:18px;padding:13px 16px;border-radius:14px;background:#fff7db;border:1px solid #f1d77a}
  .feedback.ok{background:#e9f9ef;border-color:#94d5aa}.feedback.bad{background:#fff0f0;border-color:#e9a3a3}
  .next{display:block;margin:20px auto 0;padding:13px 24px;border:0;border-radius:13px;background:#172b4d;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
  .next:disabled{opacity:.35;cursor:not-allowed}
  .complete{text-align:center;background:white;border-radius:22px;padding:35px;box-shadow:0 10px 30px #172b4d18}
  .complete h2{font-size:30px}
  @media(max-width:700px){.items{grid-template-columns:repeat(2,1fr)}.zones{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧪 Interface Sorting Lab</h1>
    <div class="sub">เกมจำแนกอุปกรณ์ตามหน้าที่ของ Interface</div>
  </header>

  <div class="bar">
    <span class="round" id="roundLabel">รอบที่ 1 / 2</span>
    <div class="progress"><i id="progress"></i></div>
    <span id="score">0 / 6</span>
  </div>

  <main id="game"></main>
</div>

<script>
const icons={Switch:"🔘","Temperature Sensor":"🌡️",Button:"🔲",LED:"💡",Relay:"🔌","DC Motor":"⚙️",Sensor:"🌡️",Motor:"⚙️"};
const round1=[
  ["Switch","Input","อุปกรณ์รับคำสั่งจากผู้ใช้ เช่น การเปิดหรือปิดวงจร"],
  ["Temperature Sensor","Input","เซนเซอร์รับข้อมูลอุณหภูมิจากสภาพแวดล้อม"],
  ["Button","Input","ปุ่มกดเป็นอุปกรณ์รับคำสั่งจากผู้ใช้"],
  ["LED","Output","LED แสดงผลด้วยแสงตามคำสั่งของระบบ"],
  ["Relay","Output","รีเลย์เป็นอุปกรณ์ส่งคำสั่งไปควบคุมอุปกรณ์ภายนอก"],
  ["DC Motor","Output","มอเตอร์ทำงานเพื่อให้เกิดการเคลื่อนไหวตามคำสั่ง"]
];
const round2=[
  ["Switch","รับคำสั่งจากผู้ใช้"],["Temperature Sensor","รับข้อมูลจากสภาพแวดล้อม"],
  ["Button","รับคำสั่งจากผู้ใช้"],["LED","แสดงผล"],["Relay","ควบคุมอุปกรณ์"],["DC Motor","ทำงานตามคำสั่ง"]
];

let round=1, score=0, placed=new Set(), zones={};

function render(){
  const game=document.getElementById("game");
  document.getElementById("roundLabel").textContent=`รอบที่ ${round} / 2`;
  document.getElementById("progress").style.width=round===1?"50%":"100%";
  document.getElementById("score").textContent=`${score} / ${round===1?6:12}`;

  if(round===1) renderRound1(game); else renderRound2(game);
}
function card(name,i){
  return `<div class="item ${placed.has(i)?"locked":""}" draggable="${!placed.has(i)}" data-i="${i}">
    <span class="icon">${icons[name]||"🧩"}</span>${name}</div>`;
}
function setupDrag(root){
  root.querySelectorAll(".item[draggable=true]").forEach(el=>{
    el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",el.dataset.i));
  });
  root.querySelectorAll(".zone").forEach(z=>{
    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over")});
    z.addEventListener("dragleave",()=>z.classList.remove("over"));
    z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");check(+e.dataTransfer.getData("text/plain"),z.dataset.zone)});
  });
}
function renderRound1(game){
  game.innerHTML=`<div class="instruction">ลากอุปกรณ์ไปยังกล่อง <b>INPUT</b> หรือ <b>OUTPUT</b></div>
    <div class="items">${round1.map((x,i)=>card(x[0],i)).join("")}</div>
    <div class="zones">
      <section class="zone" data-zone="Input"><h2>📥 INPUT</h2><p>อุปกรณ์ที่รับคำสั่งหรือข้อมูลเข้าสู่ระบบ</p><div class="drop-list" id="Input"></div></section>
      <section class="zone" data-zone="Output"><h2>📤 OUTPUT</h2><p>อุปกรณ์ที่แสดงผลหรือทำงานตามคำสั่ง</p><div class="drop-list" id="Output"></div></section>
    </div>
    <div id="feedback" class="feedback">💡 คำใบ้: ลองคิดว่าอุปกรณ์นั้น “รับข้อมูล” หรือ “ทำงาน/แสดงผล”</div>
    <button class="next" id="next" disabled>ไปยังรอบที่ 2</button>`;
  setupDrag(game);
  document.getElementById("next").onclick=()=>{round=2;placed=new Set();render()};
}
function renderRound2(game){
  game.innerHTML=`<div class="instruction">ลากอุปกรณ์ไปยัง “หน้าที่” ที่ตรงกัน</div>
    <div class="items">${round2.map((x,i)=>card(x[0],i)).join("")}</div>
    <div class="zones" style="grid-template-columns:repeat(3,1fr)">
      ${["รับคำสั่งจากผู้ใช้","รับข้อมูลจากสภาพแวดล้อม","แสดงผล","ควบคุมอุปกรณ์","ทำงานตามคำสั่ง"].map(z=>`<section class="zone" data-zone="${z}"><h2>🧩</h2><p>${z}</p><div class="drop-list" id="${z}"></div></section>`).join("")}
    </div>
    <div id="feedback" class="feedback">💡 จับคู่จากหน้าที่หลักของอุปกรณ์</div>
    <button class="next" id="next" disabled>ดูผลลัพธ์</button>`;
  setupDrag(game);
  document.getElementById("next").onclick=finish;
}
function check(i,zone){
  if(placed.has(i))return;
  const fb=document.getElementById("feedback");
  let correct=false, explanation="";
  if(round===1){correct=round1[i][1]===zone; explanation=round1[i][2]}
  else {correct=round2[i][1]===zone; explanation=`${round2[i][0]} → ${round2[i][1]}`}
  if(correct){
    placed.add(i); score++;
    const name=round===1?round1[i][0]:round2[i][0];
    document.getElementById(zone).innerHTML+=`<span class="chip">${icons[name]||"🧩"} ${name}</span>`;
    fb.className="feedback ok";fb.innerHTML=`✅ <b>ถูกต้อง!</b> ${explanation}`;
    renderItemsOnly();
  }else{
    fb.className="feedback bad";
    fb.innerHTML=`❌ ยังไม่ถูก ลองใหม่ — คำใบ้: ${round===1 ? (round1[i][1]==="Input"?"อุปกรณ์นี้รับข้อมูล/คำสั่ง":"อุปกรณ์นี้แสดงผลหรือทำงานตามคำสั่ง") : "ลองนึกถึงหน้าที่หลักของอุปกรณ์นี้"}`;
  }
  if(placed.size===6) document.getElementById("next").disabled=false;
}
function renderItemsOnly(){
  document.querySelector(".items").innerHTML=(round===1?round1:round2).map((x,i)=>card(x[0],i)).join("");
  setupDrag(document.querySelector(".items").parentElement);
}
function finish(){
  document.getElementById("game").innerHTML=`<div class="complete">
    <div style="font-size:60px">🎉</div><h2>ทำภารกิจสำเร็จ!</h2>
    <p>คุณจำแนกอุปกรณ์และจับคู่หน้าที่ได้ครบทั้ง 2 รอบ</p>
    <p><b>คะแนน: ${score} / 12</b></p>
    <button class="next" onclick="location.reload()">เล่นอีกครั้ง</button>
  </div>`;
}
render();
</script>
</body>
</html>
